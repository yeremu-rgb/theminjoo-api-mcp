[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theminjoo-api-mcp"
version = "0.5.0"
description = "Unofficial REST API and MCP server for the Democratic Party of Korea press briefings and opening remarks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "theminjoo-api-mcp contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
theminjoo-api = "theminjoo_api_mcp.main:run_api"
theminjoo-mcp = "theminjoo_api_mcp.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/theminjoo_api_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
